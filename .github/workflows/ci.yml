name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: python -m pip install -e '.[dev]'
      - name: Lint
        run: ruff check src scripts tests foundation_models
      - name: Tests (data contracts, leakage, estimator correctness)
        run: pytest -q
      - name: Mechanistic pipeline smoke test (reduced resampling)
        env: {MPLBACKEND: Agg, PYTHONPATH: src}
        run: python scripts/mechanism_analysis.py --fast --output-dir /tmp/mechanisms
