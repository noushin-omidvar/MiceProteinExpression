# Post hoc extension specified after inspecting the earlier study on 2026-11-25.
# This analysis is exploratory. It does not replace the committed original protocol.
seed: 20261125
outer_repeats: 2
outer_folds: 7
subset_draws: 1
per_class_sizes: [2, 3, 4, 5, 6]
include_full_outer_training_set: true
models: [logistic, svm, random_forest, tabpfn, kumo]
primary_metric: balanced_accuracy
representation: arithmetic_mean_per_mouse_77_proteins
preprocessing: model_pipeline_fit_on_training_subset_only
subset_rule: nested_random_permutation_within_each_class_and_outer_training_fold
test_rule: same_outer_test_mice_at_every_training_size_and_for_every_model
uncertainty_rule: descriptive_spread_by_outer_repeat;no_independent_draw_p_values
