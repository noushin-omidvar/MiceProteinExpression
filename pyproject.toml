[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mice-protein-expression"
version = "2.0.0"
description = "Mouse-level analysis of cortical protein signatures in the Ts65Dn mouse model"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fonttools>=4.40", "joblib>=1.3", "matplotlib>=3.8", "numpy>=1.26", "pandas>=2.1",
  "pyyaml>=6", "scikit-learn>=1.4", "scipy>=1.11", "statsmodels>=0.14",
  "threadpoolctl>=3", "xlrd>=2.0.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]
foundation = ["tabpfn==2.2.1", "structured-data-models==0.3.0"]
docs = ["pillow>=10", "python-pptx>=1", "reportlab>=4", "nbformat>=5.9", "nbconvert>=7",
        "ipykernel>=6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "scripts"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

